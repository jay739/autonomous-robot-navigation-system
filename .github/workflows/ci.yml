name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # The Edge Impulse SDK in Object_Detection_v2_inferencing targets the 2.x
  # ESP32 core (ESP-IDF 4.4); the 3.x core changes the camera and IDF APIs.
  ESP32_CORE: esp32:esp32@2.0.17

jobs:
  # Docs-only changes (Markdown, LICENSE, issue and discussion templates,
  # images and pages under docs/) skip the jobs below. They are skipped with a
  # job-level `if`, not paths-ignore, so required checks still pass.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # No usable base (manual run, new branch, rewritten history): build.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"
          echo "$changed"
          docs='^(.*\.md|LICENSE.*|\.github/(ISSUE_TEMPLATE|DISCUSSION_TEMPLATE)/.*|docs/.*\.(svg|png|jpe?g|gif|webp|ico|html|css))$'
          keep=''
          code_files=$( { echo "$changed" | grep -vE "$docs"; [ -n "$keep" ] && echo "$changed" | grep -E "$keep"; } | grep -c . || true)
          if [ "$code_files" -gt 0 ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Docs-only change: skipping the build and test jobs."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  compile:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Compile ${{ matrix.sketch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sketch: ESP32_CAM_Object_Detection
            fqbn: esp32:esp32:esp32cam
          - sketch: ESP32_WROVER_Robot_Controller
            fqbn: esp32:esp32:esp32wrover
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install "$ESP32_CORE" --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install ArduinoJson
      - name: Stage the sketch with the example config
        run: |
          mkdir -p "build/${{ matrix.sketch }}"
          cp "${{ matrix.sketch }}.ino" "build/${{ matrix.sketch }}/"
          cp config.example.h "build/${{ matrix.sketch }}/config.h"
      - name: Compile
        run: |
          arduino-cli compile --fqbn "${{ matrix.fqbn }}" \
            --library ./Object_Detection_v2_inferencing \
            --warnings default \
            "build/${{ matrix.sketch }}"
